name: build

# Se ejecuta en cada push a master (release automatica como pre-release), al
# empujar una etiqueta de version (release estable) o a mano desde Actions.
on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Calcula la version que se inyecta en los binarios y el tag de la release.
  # Con un tag vX.Y.Z usa esa version y publica release estable; en cualquier
  # otro caso usa el ultimo tag como base y el numero de build como parche
  # (p. ej. v1.1.42), marcado como pre-release para no disparar el auto-update
  # de los usuarios (que solo mira /releases/latest, sin pre-releases).
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      prerelease: ${{ steps.compute.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calcular version
        id: compute
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PRERELEASE="false"
          else
            BASE="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo 'v0.0')"
            MAJOR_MINOR="$(echo "$BASE" | sed -E 's/^v?([0-9]+)\.([0-9]+).*/\1.\2/')"
            VERSION="${MAJOR_MINOR}.${GITHUB_RUN_NUMBER}"
            PRERELEASE="true"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

  # Pruebas unitarias sin interfaz gráfica.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -t . -s tests -v

  # Construimos en Ubuntu 22.04 (glibc 2.35) para que el binario funcione en
  # el maximo de distros. El intento anterior en contenedor Arch salia con el
  # Python 3.14 de Arch, que exige glibc 2.44: funcionaba en Arch pero
  # crasheaba en Linux Mint 22 / Ubuntu 24.04 (glibc 2.39) con
  # "libm.so.6: version `GLIBC_2.44' not found".
  #
  # El Kivy que viene por pip trae en Kivy.libs una SDL2 2.30.0.7 con un bug
  # en Mesa 26 + Wayland (pide GLX y Xwayland devuelve 0 configs -> "No
  # matching FB config"). Lo arreglamos compilando SDL2 2.32 en el MISMO
  # Ubuntu 22.04 y sustituyendo la SDL2 bundleada. SDL2 mantiene ABI dentro
  # de 2.x, asi que el modulo Cython de Kivy (compilado contra 2.30) carga
  # la 2.32 sin recompilar. Ver AGENTS.md -> "Build Linux portable".
  linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inyectar version
        shell: bash
        run: python packaging/inject_version.py "${{ needs.version.outputs.version }}"
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libmtdev1 build-essential cmake wget \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev
      - name: Cachear SDL2 2.32 ya compilado
        id: cache-sdl2
        uses: actions/cache@v4
        with:
          path: sdl2-build
          key: sdl2-2.32.10-ubuntu2204
      - name: Compilar SDL2 2.32
        if: steps.cache-sdl2.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz
          tar xf SDL2-2.32.10.tar.gz
          cmake -S SDL2-2.32.10 -B sdl2-build -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_X11=ON -DSDL_WAYLAND=ON \
            -DSDL_OPENGL=ON -DSDL_OPENGLES=ON
          cmake --build sdl2-build -j"$(nproc)"
      - name: Compilar binario portable y AppImage
        env:
          # Kivy no debe necesitar pantalla ni GPU durante el empaquetado: el
          # hook de PyInstaller importa kivy.core.window y, sin esto, exige
          # OpenGL 2.0 y aborta en los runners sin GPU.
          KIVY_WINDOW: sdl2
          SDL_VIDEODRIVER: dummy
          KIVY_GL_BACKEND: mock
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          xvfb-run -a pyinstaller --clean --noconfirm packaging/blendermanager.spec --distpath dist --workpath build
          # Sustituir la SDL2 2.30.0.7 que Kivy trae por pip (rota en Mesa 26
          # + Wayland) por la 2.32 recien compilada. Mantenemos el nombre de
          # fichero para que el NEEDED del modulo Cython la siga encontrando.
          NEW_SDL2="$(ls sdl2-build/libSDL2-2.0.so.0.*)"
          find dist/BlenderManager -name "libSDL2-2-*" -exec cp -f "${NEW_SDL2}" {} \;
          packaging/build_appimage.sh dist
          # Copiamos el AppImage a la raíz para que el artefacto contenga
          # únicamente el archivo, sin la carpeta dist/.
          cp dist/BlenderManager-x86_64.AppImage BlenderManager-x86_64.AppImage
      - name: Smoke test del AppImage generado
        run: |
          chmod +x BlenderManager-x86_64.AppImage
          # APPIMAGE_EXTRACT_AND_RUN=1 evita necesitar libfuse2 para montar.
          APPIMAGE_EXTRACT_AND_RUN=1 ./BlenderManager-x86_64.AppImage --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: BlenderManager-linux
          path: BlenderManager-x86_64.AppImage

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inyectar version
        shell: bash
        run: python packaging/inject_version.py "${{ needs.version.outputs.version }}"
      - name: Compilar binario portable
        env:
          # Runners sin GPU: evitamos que Kivy exija OpenGL al recolectar.
          KIVY_WINDOW: sdl2
          SDL_VIDEODRIVER: dummy
          KIVY_GL_BACKEND: mock
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          pyinstaller --clean --noconfirm packaging/blendermanager.spec --distpath dist --workpath build
          Compress-Archive -Path dist/BlenderManager -DestinationPath BlenderManager-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BlenderManager-windows
          path: BlenderManager-windows-x86_64.zip

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inyectar version
        shell: bash
        run: python packaging/inject_version.py "${{ needs.version.outputs.version }}"
      - name: Compilar bundle .app
        env:
          # Runners sin GPU: evitamos que Kivy exija OpenGL al recolectar.
          KIVY_GL_BACKEND: mock
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          pyinstaller --clean --noconfirm packaging/blendermanager.spec --distpath dist --workpath build
          cd dist && zip -r ../BlenderManager-macos.zip BlenderManager.app
      - uses: actions/upload-artifact@v4
        with:
          name: BlenderManager-macos
          path: BlenderManager-macos.zip

  # Crea una Release con los binarios adjuntos. En cada push a master se
  # publica como pre-release; al empujar un tag vX.Y.Z, como release estable.
  release:
    needs: [version, test, linux, windows, macos]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Generar checksums SHA-256
        working-directory: release-assets
        run: |
          find . -type f -not -name checksums.txt -print0 \
            | sort -z | xargs -0 sha256sum > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          files: release-assets/**/*
