name: build

# Se ejecuta en cada push a master (release automatica como pre-release), al
# empujar una etiqueta de version (release estable) o a mano desde Actions.
on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Calcula la version que se inyecta en los binarios y el tag de la release.
  # Con un tag vX.Y.Z usa esa version y publica release estable; en cualquier
  # otro caso usa el ultimo tag como base y el numero de build como parche
  # (p. ej. v1.1.42), marcado como pre-release para no disparar el auto-update
  # de los usuarios (que solo mira /releases/latest, sin pre-releases).
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      prerelease: ${{ steps.compute.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calcular version
        id: compute
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PRERELEASE="false"
          else
            BASE="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo 'v0.0')"
            MAJOR_MINOR="$(echo "$BASE" | sed -E 's/^v?([0-9]+)\.([0-9]+).*/\1.\2/')"
            VERSION="${MAJOR_MINOR}.${GITHUB_RUN_NUMBER}"
            PRERELEASE="true"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

  # Pruebas unitarias sin interfaz gráfica.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -t . -s tests -v

  # Construimos dentro de un contenedor Arch porque Kivy 2.3.1 que viene
  # por pip trae una SDL2 2.30.0.7 incompatible con Mesa 26 + Wayland
  # ("No matching FB config found"). En Arch, pacman trae el modulo Cython
  # de Kivy compilado contra la SDL2 2.32+ del sistema, que si sabe caer a
  # EGL. Ver AGENTS.md -> "CI en contenedor Arch". El binario resultante
  # pesa ~170 MB porque PyInstaller arrastra las libs graficas para que
  # SDL2 pueda dlopen() libEGL/libGL/libwayland en cualquier distro.
  linux:
    needs: version
    runs-on: ubuntu-22.04
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Instalar kivy (pacman) y pyinstaller (pip)
        run: |
          # La imagen archlinux:latest viene sin keyring inicializado, asi que
          # pacman no puede verificar firmas. Inicializamos las claves antes.
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          # python-gobject es optdep de gtk3 y NO lo arrastra. Lo pedimos
          # explicito porque PyInstaller's hook-gi.py llama a
          # compat.importlib_metadata.version("pygobject") y sin el aborta el
          # COLLECT. Cuidado: los comentarios "#" dentro de un comando multi-
          # linea con "\\" se concatenan como argumentos (sh -e {0} une las
          # lineas antes de pasarlas al shell). Por eso los comentarios van
          # en lineas separadas, nunca en medio del comando.
          pacman -S --noconfirm --needed python python-pip python-kivy sdl2 sdl2_image sdl2_mixer sdl2_ttf glew gtk3 libglvnd mesa libx11 libxrandr libpng mtdev binutils wget fakeroot python-gobject
          # Solo pyinstaller por pip: kivy viene del sistema con Cython ABI
          # matching al SDL2 del sistema. requirements-build.txt instala
          # kivy==2.3.1 tambien, pero el resolver de pip ve que ya esta
          # satisfecho por el paquete del sistema y lo deja igual.
          pip install --break-system-packages pyinstaller>=6.6
          # Inyectar la version del tag en src/version.py y packaging/version_info.txt.
          # Se hace aqui (tras instalar python) y antes de pyinstaller para que el
          # binario lleve la version correcta y no se dispare el bucle de
          # auto-update (ver AGENTS.md -> "Cuidado con la numeracion").
          python packaging/inject_version.py "${{ needs.version.outputs.version }}"
      - name: Compilar binario portable y AppImage
        env:
          # Kivy no debe necesitar pantalla ni GPU durante el empaquetado: el
          # hook de PyInstaller importa kivy.core.window y, sin esto, exige
          # OpenGL 2.0 y aborta en los runners sin GPU.
          KIVY_WINDOW: sdl2
          SDL_VIDEODRIVER: dummy
          KIVY_GL_BACKEND: mock
        run: |
          pyinstaller --clean --noconfirm packaging/blendermanager.spec --distpath dist --workpath build
          packaging/build_appimage.sh dist
          # Copiamos el AppImage a la raíz para que el artefacto contenga
          # únicamente el archivo, sin la carpeta dist/.
          cp dist/BlenderManager-x86_64.AppImage BlenderManager-x86_64.AppImage
      - name: Smoke test del AppImage generado
        run: |
          chmod +x BlenderManager-x86_64.AppImage
          ./BlenderManager-x86_64.AppImage --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: BlenderManager-linux
          path: BlenderManager-x86_64.AppImage

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inyectar version
        shell: bash
        run: python packaging/inject_version.py "${{ needs.version.outputs.version }}"
      - name: Compilar binario portable
        env:
          # Runners sin GPU: evitamos que Kivy exija OpenGL al recolectar.
          KIVY_WINDOW: sdl2
          SDL_VIDEODRIVER: dummy
          KIVY_GL_BACKEND: mock
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          pyinstaller --clean --noconfirm packaging/blendermanager.spec --distpath dist --workpath build
          Compress-Archive -Path dist/BlenderManager -DestinationPath BlenderManager-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BlenderManager-windows
          path: BlenderManager-windows-x86_64.zip

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inyectar version
        shell: bash
        run: python packaging/inject_version.py "${{ needs.version.outputs.version }}"
      - name: Compilar bundle .app
        env:
          # Runners sin GPU: evitamos que Kivy exija OpenGL al recolectar.
          KIVY_GL_BACKEND: mock
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          pyinstaller --clean --noconfirm packaging/blendermanager.spec --distpath dist --workpath build
          cd dist && zip -r ../BlenderManager-macos.zip BlenderManager.app
      - uses: actions/upload-artifact@v4
        with:
          name: BlenderManager-macos
          path: BlenderManager-macos.zip

  # Crea una Release con los binarios adjuntos. En cada push a master se
  # publica como pre-release; al empujar un tag vX.Y.Z, como release estable.
  release:
    needs: [version, test, linux, windows, macos]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Generar checksums SHA-256
        working-directory: release-assets
        run: |
          find . -type f -not -name checksums.txt -print0 \
            | sort -z | xargs -0 sha256sum > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          files: release-assets/**/*
