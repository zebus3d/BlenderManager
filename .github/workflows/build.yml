name: build

# Se ejecuta en cada push a master (release automatica como pre-release), al
# empujar una etiqueta de version (release estable) o a mano desde Actions.
on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Calcula la version que se inyecta en los binarios y el tag de la release.
  # Con un tag vX.Y.Z usa esa version y publica release estable; en cualquier
  # otro caso usa el ultimo tag como base y el numero de build como parche
  # (p. ej. v1.1.42), marcado como pre-release para no disparar el auto-update
  # de los usuarios (que solo mira /releases/latest, sin pre-releases).
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      prerelease: ${{ steps.compute.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calcular version
        id: compute
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PRERELEASE="false"
          else
            BASE="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo 'v0.0')"
            MAJOR_MINOR="$(echo "$BASE" | sed -E 's/^v?([0-9]+)\.([0-9]+).*/\1.\2/')"
            VERSION="${MAJOR_MINOR}.${GITHUB_RUN_NUMBER}"
            PRERELEASE="true"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

  # Pruebas unitarias. Las de UI corren con el plugin offscreen de Qt, asi que
  # no hace falta servidor grafico (pero si PySide6 y sus libs de sistema).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias del sistema (Qt en modo offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libfontconfig1 libdbus-1-3 \
            libxkbcommon0 libgl1 libegl1
      - name: Dependencias de Python
        run: python -m pip install -r requirements.txt
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -t . -s tests -v

  # Qt Widgets renderiza con el motor *raster* (CPU): sin OpenGL, el mismo
  # AppImage funciona en cualquier distro. Se compila en Ubuntu 22.04
  # (glibc 2.35, cubre Ubuntu 22.04+/Debian 12+/Mint 21-22/Fedora 36+/Arch) y
  # PySide6 solo pide glibc 2.34, asi que el techo de glibc es el del Python.
  #
  # Lo unico que hay que vigilar es el plugin de plataforma xcb de Qt: sus
  # dependencias (libxcb-icccm4 y compania) tienen que estar en el runner para
  # que PyInstaller las bundlee; si no, el AppImage no abre en el equipo del
  # usuario ("could not load the Qt platform plugin xcb").
  linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inyectar version
        shell: bash
        run: python packaging/inject_version.py "${{ needs.version.outputs.version }}"
      - name: Dependencias del sistema (plugin xcb de Qt)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libglib2.0-0 libfontconfig1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Compilar binario portable y AppImage
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          pyinstaller --clean --noconfirm packaging/blendermanager.spec --distpath dist --workpath build
          packaging/build_appimage.sh dist
          # Copiamos el AppImage a la raíz para que el artefacto contenga
          # únicamente el archivo, sin la carpeta dist/.
          cp dist/BlenderManager-x86_64.AppImage BlenderManager-x86_64.AppImage
      - name: Smoke test del AppImage generado
        run: |
          chmod +x BlenderManager-x86_64.AppImage
          # APPIMAGE_EXTRACT_AND_RUN=1 evita necesitar libfuse2 para montar.
          APPIMAGE_EXTRACT_AND_RUN=1 ./BlenderManager-x86_64.AppImage --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: BlenderManager-linux
          path: BlenderManager-x86_64.AppImage

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inyectar version
        shell: bash
        run: python packaging/inject_version.py "${{ needs.version.outputs.version }}"
      - name: Compilar binario portable
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          pyinstaller --clean --noconfirm packaging/blendermanager.spec --distpath dist --workpath build
          Compress-Archive -Path dist/BlenderManager -DestinationPath BlenderManager-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BlenderManager-windows
          path: BlenderManager-windows-x86_64.zip

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inyectar version
        shell: bash
        run: python packaging/inject_version.py "${{ needs.version.outputs.version }}"
      - name: Compilar bundle .app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          pyinstaller --clean --noconfirm packaging/blendermanager.spec --distpath dist --workpath build
          cd dist && zip -r ../BlenderManager-macos.zip BlenderManager.app
      - uses: actions/upload-artifact@v4
        with:
          name: BlenderManager-macos
          path: BlenderManager-macos.zip

  # Crea una Release con los binarios adjuntos. En cada push a master se
  # publica como pre-release; al empujar un tag vX.Y.Z, como release estable.
  release:
    needs: [version, test, linux, windows, macos]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Generar checksums SHA-256
        working-directory: release-assets
        run: |
          find . -type f -not -name checksums.txt -print0 \
            | sort -z | xargs -0 sha256sum > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          files: release-assets/**/*
