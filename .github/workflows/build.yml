name: build

# Se ejecuta al empujar una etiqueta de versión (v1.0, v1.0.1...) o a mano.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Pruebas unitarias sin interfaz gráfica.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -t . -s tests -v

  # Nota: usamos ubuntu-22.04 (glibc 2.35) porque los contenedores manylinux
  # traen un Python sin librería compartida y PyInstaller no puede empaquetarlo.
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias del sistema (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libmtdev1
      - name: Compilar binario portable y AppImage
        env:
          # Kivy no debe necesitar pantalla ni GPU durante el empaquetado: el
          # hook de PyInstaller importa kivy.core.window y, sin esto, exige
          # OpenGL 2.0 y aborta en los runners sin GPU.
          KIVY_WINDOW: sdl2
          SDL_VIDEODRIVER: dummy
          KIVY_GL_BACKEND: mock
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          xvfb-run -a pyinstaller --clean --noconfirm packaging/blendermanager.spec --distpath dist --workpath build
          packaging/build_appimage.sh dist
          # Copiamos el AppImage a la raíz para que el artefacto contenga
          # únicamente el archivo, sin la carpeta dist/.
          cp dist/BlenderManager-x86_64.AppImage BlenderManager-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: BlenderManager-linux
          path: BlenderManager-x86_64.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar binario portable
        env:
          # Runners sin GPU: evitamos que Kivy exija OpenGL al recolectar.
          KIVY_WINDOW: sdl2
          SDL_VIDEODRIVER: dummy
          KIVY_GL_BACKEND: mock
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          pyinstaller --clean --noconfirm packaging/blendermanager.spec --distpath dist --workpath build
          Compress-Archive -Path dist/BlenderManager -DestinationPath BlenderManager-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BlenderManager-windows
          path: BlenderManager-windows-x86_64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar bundle .app
        env:
          # Runners sin GPU: evitamos que Kivy exija OpenGL al recolectar.
          KIVY_GL_BACKEND: mock
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          pyinstaller --clean --noconfirm packaging/blendermanager.spec --distpath dist --workpath build
          cd dist && zip -r ../BlenderManager-macos.zip BlenderManager.app
      - uses: actions/upload-artifact@v4
        with:
          name: BlenderManager-macos
          path: BlenderManager-macos.zip

  # Al empujar una etiqueta vX.Y.Z se crea una Release con los binarios
  # adjuntos (asi no hace falta versionarlos dentro del repositorio).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
