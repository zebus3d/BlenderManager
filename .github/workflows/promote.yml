name: promote

# Convierte el pre-release rodante en release final, a mano (Actions ->
# promote -> Run workflow).
#
# NO reconstruye nada: reutiliza los binarios que ya se compilaron y probaron,
# asi que la version cocida dentro de ellos sigue coincidiendo con el tag. Es
# justo por eso que las iteraciones de main comparten version con la final a
# la que aspiran (v1.3.0): promover solo le quita la marca de pre-release. Si
# la promocion cambiara la version, la app se actualizaria en bucle.
#
# Despues de promover, el siguiente push a main calcula la minor siguiente
# (v1.4.0) y empieza un ciclo nuevo.
on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promover el pre-release a release final
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
                   --jq '[.[] | select(.prerelease)][0].tag_name')"
          if [[ -z "${TAG}" || "${TAG}" == "null" ]]; then
            echo "No hay ningun pre-release que promover." >&2
            exit 1
          fi
          echo "Promoviendo ${TAG} a release final"
          # El pre-release se llama "vX.Y.Z (build N)"; a final se le quita el
          # numero de build y se le ponen las notas generadas desde la release
          # final anterior. Si generate-notes falla, se promueve igual.
          NOTES="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                     -f tag_name="${TAG}" --jq .body 2>/dev/null || true)"
          # La "Code signing policy" tiene que estar tambien en la pagina de
          # descarga (signpath.org/terms): se anade al final de las notas.
          POLICY="$(printf '\n\n---\n**Code signing policy**: free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org).\nPrivacy policy: [PRIVACY.md](https://github.com/%s/blob/main/PRIVACY.md).' "${GITHUB_REPOSITORY}")"
          NOTES="${NOTES}${POLICY}"
          ARGS=(--prerelease=false --latest --title "${TAG}")
          [[ -n "${NOTES}" ]] && ARGS+=(--notes "${NOTES}")
          # -R es obligatorio: este job no hace checkout, y sin el, gh intenta
          # sacar el repo del git local y falla con "not a git repository".
          gh release edit "${TAG}" -R "${GITHUB_REPOSITORY}" "${ARGS[@]}"
          # Comprobacion: /releases/latest (que ignora los pre-releases) tiene
          # que ser ya este tag. Ojo: `gh release view --json isLatest` NO
          # existe en todas las versiones de gh, asi que se mira por la API.
          LATEST="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" \
                     --jq .tag_name)"
          echo "latest ahora: ${LATEST}"
          [[ "${LATEST}" == "${TAG}" ]]
